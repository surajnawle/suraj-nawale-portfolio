        .bg-blueprint {
            background-size: 80px 80px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-position: 0 0, 0 0, 40px 40px, 40px 40px;
        }
        .mechanical-border {
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .mechanical-border::before, .mechanical-border::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: var(--brand-emerald);
            border-style: solid;
            opacity: 0.5;
        }
        .corner-tl::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .corner-tr::after { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
        .corner-bl::before { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
        .corner-br::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        .glass-industrial {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }
        .glass-industrial:hover {
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(22, 22, 22, 0.9);
        }
        .text-platinum { color: var(--text-platinum); }
        .platinum-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #777777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-industrial {
            background: var(--text-platinum);
            color: var(--surface-obsidian);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }
        .btn-industrial:hover {
            background: var(--brand-emerald);
            color: white;
            transform: scale(1.02);
        }
        .timeline-industrial::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 20px;
            bottom: 20px;
            width: 2px;
            background: repeating-linear-gradient(to bottom, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 20px);
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            animation: scanline 4s linear infinite;
        }
        .pulse-emerald {
            animation: pulse-emerald 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-emerald {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }
        @media (min-width: 1024px) {
            .timeline-industrial::before { left: 50%; transform: translateX(-50%); }
        }
        ::selection { background: var(--brand-emerald); color: white; }
